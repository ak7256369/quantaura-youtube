name: Daily channel video

on:
  schedule:
    # 18:00 UTC — 2pm US Eastern / 11am Pacific. Publishes a few hours ahead of
    # the US evening watch window so the Short builds early velocity going into
    # peak, rather than at US breakfast. (Sep 2026: US Eastern is EDT, UTC-4.)
    - cron: '0 18 * * *'
    # 21:00 UTC catch-up (5pm Eastern). GitHub's cron is best-effort: runs are
    # delayed under load and dropped outright when the queue is congested, and
    # on 2026-08-06 the primary slot never fired at all. The pipeline refuses to
    # publish twice in a UTC day (see common.published_today), so on a normal
    # day this second run exits in seconds having done nothing.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      no_upload:
        description: 'Build the video but do not publish it'
        type: boolean
        default: false
      force:
        description: 'Publish even if a video already went out today'
        type: boolean
        default: false
      no_voice:
        description: 'Silent placeholder audio (fast render check)'
        type: boolean
        default: false
      no_drive:
        description: 'Skip the Google Drive mirror'
        type: boolean
        default: false
      check_drive:
        description: 'Verify Drive credentials only — renders nothing, publishes nothing'
        type: boolean
        default: false
      drive_only:
        description: 'X post only — render and mirror to Drive, no YouTube upload, scoreboard untouched'
        type: boolean
        default: false
      dry_run:
        description: 'Synthetic data, no API calls, no upload'
        type: boolean
        default: false

# The scoreboard is append-only state in git. Two concurrent runs would race
# on the same file and one would lose its call.
concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write        # commit the updated scoreboard back to main
  actions: read          # drive_only pulls the published run's mp4 artifact

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        # Nothing is rendered on a credential check, so skip the apt round-trip.
        if: inputs.check_drive != true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Kokoro voice model
        if: inputs.check_drive != true
        uses: actions/cache@v4
        with:
          # ~350MB of ONNX weights. Downloading these daily would be the
          # slowest step in the pipeline by a wide margin.
          path: models
          key: kokoro-v1.0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the published render
        # --drive-only must mirror the exact file that went to YouTube, not a
        # fresh render of the same day — same call, but minutes later and a few
        # dollars off, which would leave the X post disagreeing with the video.
        # The published mp4 lives in that run's artifact (7-day retention).
        # Best-effort: if nothing is found the pipeline just renders.
        if: inputs.drive_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%F)
          mkdir -p build

          # The publishing run records its own id in the log. Prefer that: a
          # --drive-only run also leaves a video-* artifact, so "the newest run
          # with an mp4" would happily pick up an earlier re-render instead of
          # the file that actually went to YouTube.
          RUN_ID=$(TODAY="$TODAY" python - <<'PY'
          import json, os, pathlib
          today, out = os.environ["TODAY"], ""
          p = pathlib.Path("state/runs.jsonl")
          if p.exists():
              for ln in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      r = json.loads(ln)
                  except Exception:
                      continue
                  if (r.get("date") == today and r.get("kind", "daily") == "daily"
                          and r.get("status") == "published" and r.get("run_id")):
                      out = str(r["run_id"])
          print(out)
          PY
          )

          # Rows written before run_id was logged have none; the day's scheduled
          # run is the right guess for those.
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow=daily-video.yml --event=schedule \
                       --status=success --limit 10 --json databaseId,createdAt \
                       -q "[.[] | select(.createdAt | startswith(\"$TODAY\"))] | .[0].databaseId // empty")
            echo "No run_id in the log — falling back to today's scheduled run: ${RUN_ID:-none}"
          fi

          if [ -z "$RUN_ID" ]; then
            echo "Nothing published for $TODAY — the pipeline will render fresh."
            exit 0
          fi

          gh run download "$RUN_ID" --dir _restore --pattern 'video-*' 2>/dev/null || {
            echo "Artifact for run $RUN_ID unavailable (expired?) — rendering fresh."
            exit 0; }
          SRC=$(find _restore -name video.mp4 -print -quit)
          D=$(dirname "${SRC:-_restore/none}")
          # All three or none: a video without its snapshot cannot be captioned.
          if [ -n "$SRC" ] && [ -f "$D/snapshot.json" ] && [ -f "$D/script.json" ]; then
            cp "$D/video.mp4" "$D/snapshot.json" "$D/script.json" build/
            echo "Restored the published render from run $RUN_ID"
          else
            echo "Run $RUN_ID has no complete render — the pipeline will render fresh."
          fi

      - name: Run pipeline
        env:
          # Model + market data (premium service account — /api/signals redacts
          # confidence and per-model votes for free-tier callers)
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          # Script writing, with automatic fallback between providers
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Publishing
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Google Drive mirror — where the mp4 lands for the manual X post.
          # Its own refresh token on the drive.file scope; the client id/secret
          # fall back to the YouTube pair because it is the same OAuth client.
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Operator notifications
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS="$ARGS --no-upload"
          [ "${{ inputs.no_voice }}"  = "true" ] && ARGS="$ARGS --no-voice"
          [ "${{ inputs.dry_run }}"   = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"     = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.no_drive }}"  = "true" ] && ARGS="$ARGS --no-drive"
          [ "${{ inputs.check_drive }}" = "true" ] && ARGS="$ARGS --check-drive"
          [ "${{ inputs.drive_only }}"  = "true" ] && ARGS="$ARGS --drive-only"
          python pipeline.py $ARGS

      - name: Commit scoreboard
        # Runs even when the pipeline skipped the day: a graded outcome and the
        # run log are worth keeping regardless of whether a video shipped.
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain state)" ]; then
            echo "No scoreboard changes to commit."
            exit 0
          fi
          git config user.name  "quantaura-channel[bot]"
          git config user.email "channel@quantaura.tech"
          git add state
          git commit -m "scoreboard $(date -u +%F)"
          # This repo has no other writers on a normal day, but the weekly
          # workflow shares the concurrency group and a manual dispatch can
          # land close — keep the rebase-and-retry.
          for i in 1 2 3; do
            if git push; then
              echo "Scoreboard pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected — rebasing on origin/main (attempt $i/3)"
            if git pull --rebase origin main; then
              continue
            fi
            # state/*.jsonl union-merges (see state/.gitattributes), so the only
            # file that can genuinely conflict is scoreboard.json — and that one
            # is derived, not authored: summary() rebuilds it from the merged
            # predictions log. Regenerate rather than merge. Anything else
            # conflicting is a real surprise and should stop for a human.
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "state/scoreboard.json" ]; then
              echo "Unexpected rebase conflict, leaving it alone:"
              echo "$conflicts"
              git rebase --abort || true
              exit 1
            fi
            echo "Regenerating state/scoreboard.json from the merged log..."
            if ! python -c "import scoreboard; scoreboard.summary()"; then
              echo "Could not regenerate the scoreboard summary."
              git rebase --abort || true
              exit 1
            fi
            git add state/scoreboard.json
            if ! GIT_EDITOR=true git rebase --continue; then
              echo "Rebase could not be completed."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Could not push the scoreboard after 3 attempts."
          exit 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          # If the upload step failed, the mp4 here is the fallback: download
          # it and publish by hand rather than losing the day's work.
          path: |
            build/*.mp4
            build/*.jpg
            build/*.json
            build/*.ass
            build/*.txt
          retention-days: 7
          if-no-files-found: ignore
