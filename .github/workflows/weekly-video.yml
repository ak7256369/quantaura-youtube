name: Weekly recap video

on:
  schedule:
    # Sunday 20:00 UTC (4pm US Eastern) — two hours after the daily run's new
    # 18:00 slot, so the week's last graded outcome is already committed when the
    # recap reads the scoreboard. Lands in the US Sunday-afternoon watch window.
    # Keep this exactly two hours behind the daily cron if that ever moves again.
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      no_upload:
        description: 'Build the video but do not publish it'
        type: boolean
        default: false
      no_voice:
        description: 'Silent placeholder audio (fast layout check)'
        type: boolean
        default: false
      no_drive:
        description: 'Skip the Google Drive mirror'
        type: boolean
        default: false
      drive_only:
        description: 'X clip only — mirror to Drive, no YouTube upload, no blog post'
        type: boolean
        default: false
      dry_run:
        description: 'Synthetic week, no API calls, no upload'
        type: boolean
        default: false
      force:
        description: 'Publish even if a recap already went out today'
        type: boolean
        default: false

# Same group as the daily workflow, deliberately: both commit state/, and
# serialising them is what makes that race impossible rather than merely
# unlikely.
concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write
  actions: read          # drive_only pulls the published recap's mp4 artifact

jobs:
  publish:
    runs-on: ubuntu-latest
    # 60, not the daily's 45: the recap is now ~4 minutes of 1080p rather than
    # ~2, and the closing mux burns captions over the whole thing at preset
    # medium. The 2026-08-09 run took 7 minutes end to end; this leaves room.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the published recap
        # Same as the daily's restore step, but keyed on the most recent
        # published weekly rather than today's — a recap publishes on Sunday and
        # a --drive-only rerun will usually be some other day.
        if: inputs.drive_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          RUN_ID=$(python - <<'PY'
          import json, pathlib
          out = ""
          p = pathlib.Path("state/runs.jsonl")
          if p.exists():
              for ln in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      r = json.loads(ln)
                  except Exception:
                      continue
                  if (r.get("kind") == "weekly" and r.get("status") == "published"
                          and r.get("run_id")):
                      out = str(r["run_id"])
          print(out)
          PY
          )
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow=weekly-video.yml --event=schedule \
                       --status=success --limit 5 --json databaseId \
                       -q '.[0].databaseId // empty')
            echo "No run_id in the log — falling back to the last scheduled recap: ${RUN_ID:-none}"
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No published recap found — the pipeline will render fresh."
            exit 0
          fi
          gh run download "$RUN_ID" --dir _restore --pattern 'weekly-*' 2>/dev/null || {
            echo "Artifact for run $RUN_ID unavailable (expired?) — rendering fresh."
            exit 0; }
          SRC=$(find _restore -name weekly.mp4 -print -quit)
          D=$(dirname "${SRC:-_restore/none}")
          if [ -n "$SRC" ] && [ -f "$D/weekly_facts.json" ] && [ -f "$D/weekly_script.json" ]; then
            cp "$D/weekly.mp4" "$D/weekly_facts.json" "$D/weekly_script.json" build/
            echo "Restored the published recap from run $RUN_ID"
          else
            echo "Run $RUN_ID has no complete recap — the pipeline will render fresh."
          fi

      - name: Run weekly recap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Drive mirror — the recap lands beside the dailies. It is landscape
          # and minutes long, so it is over X's 140s cap for non-Premium
          # accounts: mirrored for trimming or for posting elsewhere.
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS="$ARGS --no-upload"
          [ "${{ inputs.no_voice }}"  = "true" ] && ARGS="$ARGS --no-voice"
          [ "${{ inputs.no_drive }}"  = "true" ] && ARGS="$ARGS --no-drive"
          [ "${{ inputs.drive_only }}" = "true" ] && ARGS="$ARGS --drive-only"
          [ "${{ inputs.dry_run }}"   = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"     = "true" ] && ARGS="$ARGS --force"
          python weekly.py $ARGS

      - name: Commit scoreboard
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain state)" ]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name  "quantaura-channel[bot]"
          git config user.email "channel@quantaura.tech"
          git add state
          git commit -m "weekly run $(date -u +%F)"
          # Shares the daily-video concurrency group, so contention here is the
          # expected case, not the rare one.
          for i in 1 2 3; do
            if git push; then
              echo "State pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected — rebasing on origin/main (attempt $i/3)"
            if git pull --rebase origin main; then
              continue
            fi
            # state/*.jsonl union-merges (see state/.gitattributes), so the only
            # file that can genuinely conflict is scoreboard.json — and that one
            # is derived, not authored: summary() rebuilds it from the merged
            # predictions log. Regenerate rather than merge.
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "state/scoreboard.json" ]; then
              echo "Unexpected rebase conflict, leaving it alone:"
              echo "$conflicts"
              git rebase --abort || true
              exit 1
            fi
            echo "Regenerating state/scoreboard.json from the merged log..."
            if ! python -c "import scoreboard; scoreboard.summary()"; then
              echo "Could not regenerate the scoreboard summary."
              git rebase --abort || true
              exit 1
            fi
            git add state/scoreboard.json
            if ! GIT_EDITOR=true git rebase --continue; then
              echo "Rebase could not be completed."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Could not push state after 3 attempts."
          exit 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_number }}
          path: |
            build/weekly.mp4
            build/weekly_thumbnail.jpg
            build/weekly_*.json
          retention-days: 7
          if-no-files-found: ignore
