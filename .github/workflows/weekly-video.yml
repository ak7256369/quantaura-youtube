name: Weekly recap video

on:
  schedule:
    # Sunday 15:00 UTC — two hours after the daily run, so the week's last
    # graded outcome is already committed when the recap reads the scoreboard.
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      no_upload:
        description: 'Build the video but do not publish it'
        type: boolean
        default: false
      no_voice:
        description: 'Silent placeholder audio (fast layout check)'
        type: boolean
        default: false
      dry_run:
        description: 'Synthetic week, no API calls, no upload'
        type: boolean
        default: false
      force:
        description: 'Publish even if a recap already went out today'
        type: boolean
        default: false

# Same group as the daily workflow, deliberately: both commit state/, and
# serialising them is what makes that race impossible rather than merely
# unlikely.
concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly recap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS="$ARGS --no-upload"
          [ "${{ inputs.no_voice }}"  = "true" ] && ARGS="$ARGS --no-voice"
          [ "${{ inputs.dry_run }}"   = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}"     = "true" ] && ARGS="$ARGS --force"
          python weekly.py $ARGS

      - name: Commit scoreboard
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain state)" ]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name  "quantaura-channel[bot]"
          git config user.email "channel@quantaura.tech"
          git add state
          git commit -m "weekly run $(date -u +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected — rebasing on origin/main (attempt $i)"
            git pull --rebase origin main
          done
          echo "Could not push state after 3 attempts."
          exit 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_number }}
          path: |
            build/weekly.mp4
            build/weekly_thumbnail.jpg
            build/weekly_*.json
          retention-days: 7
          if-no-files-found: ignore
